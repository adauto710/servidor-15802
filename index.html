<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Sugestões de Manutenção</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Gerador de Sugestões de Manutenção</h1>
    </header>

    <main>
        <div class="activity" data-activity="painting">
            <h2>Pintura</h2>
            <div class="image-section">
                <div style="display: flex; align-items: flex-start; justify-content: center; gap: 20px; flex-wrap: wrap;">
                    <div>
                        <h3>Antes</h3>
                        <input type="file" accept="image/*" id="painting-before">
                        <div id="preview-painting-before" class="image-preview"></div>
                        <div id="suggestion-painting-before" class="suggestion-text"></div>
                    </div>
                    <div>
                        <h3>Durante</h3>
                        <input type="file" accept="image/*" id="painting-during">
                        <div id="preview-painting-during" class="image-preview"></div>
                        <div id="suggestion-painting-during" class="suggestion-text"></div>
                    </div>
                    <div>
                        <h3>Depois</h3>
                        <input type="file" accept="image/*" id="painting-after">
                        <div id="preview-painting-after" class="image-preview"></div>
                        <div id="suggestion-painting-after" class="suggestion-text"></div>
                    </div>
                </div>
            </div>
            <button onclick="showPrompt('painting')">Mostrar Sugestões</button>
            <button onclick="gerarPDF('painting')">Gerar PDF para WhatsApp</button>
        </div>
